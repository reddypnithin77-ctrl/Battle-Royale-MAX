name: Auth Verifier Checks

on:
  push:
    paths:
      - "Server/**"
      - ".github/workflows/auth-verifier.yml"
  pull_request:
    paths:
      - "Server/**"
      - ".github/workflows/auth-verifier.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install verifier dependencies
        working-directory: Server
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check server JavaScript syntax
        working-directory: Server
        run: node --check src/server.js && node --check src/auth-security.js
      - name: Run authentication security tests
        working-directory: Server
        run: npm test
      - name: Build authentication server container
        run: docker build -t brmax-auth-server ./Server
