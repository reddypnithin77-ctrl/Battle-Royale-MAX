services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brmax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-brmax}
    volumes:
      - brmax-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brmax} -d ${POSTGRES_DB:-brmax}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-server:
    build:
      context: ./Server
    restart: unless-stopped
    environment:
      PORT: "8080"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      DATABASE_URL: postgresql://${POSTGRES_USER:-brmax}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-brmax}
      PGSSLMODE: disable
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:?Set FIREBASE_SERVICE_ACCOUNT_PATH in .env}:/run/secrets/firebase-service-account.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  brmax-postgres:
